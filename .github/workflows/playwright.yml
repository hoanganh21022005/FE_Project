name: Playwright UI tests

on:
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lưu kết quả khi kiểm thử thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
