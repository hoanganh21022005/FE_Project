name: FE 2 checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/admin/**'
      - 'src/components/modals/PaymentModal.jsx'
      - 'src/components/modals/NewClassModal.jsx'
      - 'src/components/views/CoachAssignedMembersView.jsx'
      - 'src/components/views/MyMembershipView.jsx'
      - 'src/components/views/ReceptionClassBooking.jsx'
      - 'src/components/views/ReceptionPaymentsView.jsx'
      - 'src/api/invoiceMappers.js'
      - 'src/api/managerApi.js'
      - 'src/api/normalClassCreation.js'
      - 'src/context/SCMSContext.jsx'
      - 'src/components/common/Badge.jsx'
      - 'src/utils/memberSafetyHelpers.js'
      - 'test/fe2_membership_payment_test.mjs'
      - 'test/fe10_normal_class_test.mjs'
      - 'test/fe11_integration_regression_test.mjs'
      - '.github/workflows/fe2-checks.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node test/fe2_membership_payment_test.mjs
      - run: node test/fe10_normal_class_test.mjs --unit-only
      - run: node test/fe11_integration_regression_test.mjs
      - run: npm run build
      - run: npm run build:local
